# Quitegood Support - RustDesk OSS server. hbbs/hbbr are reachable ONLY through nginx on 443
# (wss://support.quitegood.be/ws/id and /ws/relay). No RustDesk port is exposed publicly.
services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: qg-hbbs
    # -r: relay announced to peers; the client turns it into wss://support.quitegood.be/ws/relay
    # -k _: only clients holding this server's public key may use it
    command: hbbs -r support.quitegood.be -k _
    volumes:
      - ./data:/root
    ports:
      - "127.0.0.1:21118:21118"   # WebSocket rendezvous, behind nginx /ws/id
    depends_on: [hbbr]
    restart: unless-stopped

  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: qg-hbbr
    command: hbbr -k _
    volumes:
      - ./data:/root
    ports:
      - "127.0.0.1:21119:21119"   # WebSocket relay, behind nginx /ws/relay
    restart: unless-stopped
