name: Quitegood - release client

# Builds the Quitegood-branded RustDesk client (Windows x64, macOS Intel + Apple Silicon)
# and publishes it with fixed file names, so the website links never change:
#   https://github.com/<owner>/<repo>/releases/latest/download/QuitegoodSupport-Windows.exe
#   https://github.com/<owner>/<repo>/releases/latest/download/QuitegoodSupport-macOS-AppleSilicon.dmg
#   https://github.com/<owner>/<repo>/releases/latest/download/QuitegoodSupport-macOS-Intel.dmg
# Server key: quitegood/settings.json (optional override: repository variable QG_SERVER_KEY).

on:
  workflow_dispatch:
  push:
    tags: ["qg-v*"]
    branches: ["qg-release"]   # push quitegood -> qg-release to publish a new client

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/quitegood-flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "qg-build"

  publish:
    needs: build
    # publish whatever was built, even if one platform failed (e.g. no macOS arm64 runner)
    if: ${{ always() }}
    uses: ./.github/workflows/quitegood-publish.yml
    secrets: inherit
